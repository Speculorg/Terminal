# Static configuration (bootstrap window; HTTP only)
#
# - Bound to localhost to avoid exposing the bootstrap window outside of the container network.
# - Dashboard is enabled for debugging inside the container.
log:
  level: INFO

accessLog: {}

api:
  dashboard: true
  insecure: true

entryPoints:
  web:
    address: "127.0.0.1:8080"

providers:
  file:
    directory: /config
    watch: true
