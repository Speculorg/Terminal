# Static configuration (bootstrap window / internal only)
#
# TERM-1:
# - HTTP entrypoint bound to loopback inside container (not published to host).
# - No Consul Catalog provider here (token+mTLS будут подключены в secure config).
# - This mode exists only because DaemonPolicy expects http->https switch.

log:
  level: INFO

accessLog: {}

api:
  dashboard: true

entryPoints:
  web:
    address: "127.0.0.1:8080"

providers:
  file:
    directory: /config
    watch: true
