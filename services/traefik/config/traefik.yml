# services/traefik/config/traefik.yml
# TERM-1: single static config for Traefik.
# Providers: Consul Catalog + File (TLS stores/certs).
# NOTE: web (:8080) should be INTERNAL only (not published to host).
# websecure (:8443) is published to host.

global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: INFO

accessLog: {}

api:
  dashboard: true
  insecure: false

ping:
  entryPoint: web

entryPoints:
  web:
    address: ":8080"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: ":8443"

providers:
  # TLS certificates/stores are only configurable via the File provider (dynamic config). :contentReference[oaicite:8]{index=8}
  file:
    filename: "/config/traefik_dynamic.yml"
    watch: true

  consulCatalog:
    endpoint:
      scheme: https
      address: "consul:8501"
      tls:
        ca:   "/fs/terminal/certs/ca.crt"
        cert: "/fs/terminal/certs/traefik.crt"
        key:  "/fs/terminal/certs/traefik.key"
        insecureSkipVerify: false
    watch: true
    exposedByDefault: false
    prefix: "traefik"
    refreshInterval: "15s"