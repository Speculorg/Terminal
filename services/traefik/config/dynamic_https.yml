# Dynamic configuration (secure mode, shared for all services)
#
# Responsibilities:
# - inbound TLS store + mTLS client auth options (mtls)
# - upstream mTLS transport for backends discovered via Consul Catalog
#
# Traefik routing is configured via Consul service tags:
# - exposedByDefault=false (in static config)
# - each service must set traefik.enable=true + router/service tags

tls:
  stores:
    default:
      defaultCertificate:
        certFile: /fs/terminal/certs/traefik.crt
        keyFile: /fs/terminal/certs/traefik.key

  options:
    mtls:
      clientAuth:
        caFiles:
          - /fs/terminal/certs/ca.crt
        clientAuthType: RequireAndVerifyClientCert

http:
  serversTransports:
    mtls-upstream:
      rootcas:
        - /fs/terminal/certs/ca.crt
      certificates:
        - /fs/terminal/certs/traefik.pem
