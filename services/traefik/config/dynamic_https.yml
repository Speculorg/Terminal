# Dynamic configuration (secure mode)
#
# Only shared TLS/mTLS options and upstream transports live here.
# Routers/services are discovered via Consul Catalog provider.

tls:
  options:
    mtls:
      clientAuth:
        caFiles:
          - /fs/terminal/certs/ca.crt
        clientAuthType: RequireAndVerifyClientCert

serversTransports:
  default:
    rootCAs:
      - /fs/terminal/certs/ca.crt
    certificates:
      - certFile: /fs/terminal/certs/traefik.crt
        keyFile: /fs/terminal/certs/traefik.key
