# Static configuration (secure mode)
#
# - No Docker provider (no docker.sock mount).
# - Dynamic config is loaded via the file provider from /config (see dynamic_https.yml).
# - After bootstrap window: inbound TLS + mTLS (client auth) enforced via tls options from file provider.

log:
  level: INFO

accessLog: {}

api:
  dashboard: true

entryPoints:
  web:
    address: ":8080"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":8443"
    http:
      tls:
        options: mtls@file

providers:
  file:
    directory: /config
    watch: true
