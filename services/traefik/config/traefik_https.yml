# Static configuration (secure mode)
#
# IMPORTANT:
# - This file is kept as a human-readable reference.
# - Real runtime config is generated by bootstrap into:
#     /config/traefik_https.generated.yml
#
# TERM-1:
# - Providers: Consul Catalog (+ file provider for tls/options/serversTransports)
# - EntryPoints: only websecure (:8443) + mTLS required (tls options from file provider)
# - Dashboard available via api@internal (router defined via Consul tags)

log:
  level: INFO

accessLog: {}

api:
  dashboard: true

entryPoints:
  websecure:
    address: ":8443"
    http:
      tls:
        options: mtls@file

providers:
  file:
    directory: /config
    watch: true

  # consulCatalog provider is injected by bootstrap into generated config
