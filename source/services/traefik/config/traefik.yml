# source\services\traefik\config\traefik.yml

entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"

api:
  dashboard: true
  insecure: false

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
  consulCatalog:
    endpoint:
      address: "consul-service:8500"
    prefix: "traefik"
    exposedByDefault: false

ping:
  entryPoint: web

log:
  level: INFO

accessLog:
  bufferingSize: 100
  filters:
    statusCodes: ["400-499", "500-599"]