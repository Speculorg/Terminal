# source\services\traefik\config\traefik.yml


global:
  checkNewVersion: false
  sendAnonymousUsage: false


log:
  level: INFO


api:
  dashboard: true
  insecure: false


ping:
  entryPoint: web


entryPoints:
  web:
    address: :80
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  
  websecure:
    address: :443


tls:
  certificates:
    - certFile: /certs/traefik.crt
      keyFile:  /certs/traefik.key
  options:
    default:
      minVersion: VersionTLS12
      sniStrict:  true


providers:
  consulCatalog:
    endpoint:
      scheme: https
      address: consul:8501
      tls:
        ca:   /certs/ca.crt
        cert: /certs/traefik.crt
        key:  /certs/traefik.key
        insecureSkipVerify: false
    watch: true
    exposedByDefault: false
    prefix: traefik
    refreshInterval: 15s
