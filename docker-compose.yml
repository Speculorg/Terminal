networks:
  net_private:
    driver: bridge
    internal: true

  net_public:
    driver: bridge

volumes:
  consul_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./volumes/consul_data

  vault_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./volumes/vault_data

  fs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./volumes/fs

  db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./volumes/db_data

services:
  consul:
    container_name: Consul
    hostname: consul
    build:
      context: ./services/consul
      dockerfile: Dockerfile
    env_file:
      - ./configs.env
    environment:
      PYTHONPATH: "/"
      PYTHONUNBUFFERED: "1"
      SERVICE_NAME: "consul"
      SERVICE_PORT: 8501
      # Consul Catalog: publish only explicitly enabled services
      SERVICE_TAGS: >-
        infra,kv,core,
        traefik.enable=true,
        traefik.http.routers.consul.rule=Host(`consul.terminal.local`),
        traefik.http.routers.consul.entrypoints=websecure,
        traefik.http.routers.consul.tls=true,
        traefik.http.services.consul.loadbalancer.server.scheme=https,
        traefik.http.services.consul.loadbalancer.server.port=8501,
        traefik.http.services.consul.loadbalancer.serverstransport=mtls-upstream@file
      CONSUL_HTTP_TOKEN_FILE: "/fs/terminal/secrets/consul_token_for_consul"
    volumes:
      - ./configs.env:/configs.env:ro
      - ./core:/core:ro
      - ./services:/services:ro
      - ./services/consul/config:/config:rw
      - ./services/consul/app:/app:ro
      - consul_data:/consul/data
      - fs:/fs/terminal
    networks:
      - net_private
    ports:
      - "8500:8500"
      - "8501:8501"
    restart: unless-stopped

  vault:
    container_name: Vault
    hostname: vault
    build:
      context: ./services/vault
      dockerfile: Dockerfile
    cap_add:
      - IPC_LOCK
    env_file:
      - ./configs.env
    environment:
      PYTHONPATH: "/"
      PYTHONUNBUFFERED: "1"
      SERVICE_NAME: "vault"
      SERVICE_PORT: 8200
      SERVICE_TAGS: >-
        infra,ca,core,
        traefik.enable=true,
        traefik.http.routers.vault.rule=Host(`vault.terminal.local`),
        traefik.http.routers.vault.entrypoints=websecure,
        traefik.http.routers.vault.tls=true,
        traefik.http.services.vault.loadbalancer.server.scheme=https,
        traefik.http.services.vault.loadbalancer.server.port=8200,
        traefik.http.services.vault.loadbalancer.serverstransport=mtls-upstream@file
      CONSUL_HTTP_TOKEN_FILE: "/fs/terminal/secrets/consul_token_for_vault"
    volumes:
      - ./configs.env:/configs.env:ro
      - ./core:/core:ro
      - ./services:/services:ro
      - ./services/vault/app:/app:ro
      - ./services/vault/config:/config:rw
      - vault_data:/vault/file
      - fs:/fs/terminal
    networks:
      - net_private
    ports:
      - "8200:8200"
    restart: unless-stopped

  traefik:
    container_name: Traefik
    hostname: traefik
    build:
      context: ./services/traefik
      dockerfile: Dockerfile
    env_file:
      - ./configs.env
    environment:
      PYTHONPATH: "/"
      PYTHONUNBUFFERED: "1"
      SERVICE_NAME: "traefik"
      SERVICE_PORT: 8443
      SERVICE_TAGS: >-
        infra,edge,core,
        traefik.enable=true,
        traefik.http.routers.traefik.rule=Host(`traefik.terminal.local`),
        traefik.http.routers.traefik.entrypoints=websecure,
        traefik.http.routers.traefik.service=api@internal,
        traefik.http.routers.traefik.tls=true
      CONSUL_HTTP_TOKEN_FILE: "/fs/terminal/secrets/consul_token_for_traefik"
    volumes:
      - ./configs.env:/configs.env:ro
      - ./core:/core:ro
      - ./services:/services:ro
      - ./services/traefik/app:/app:ro
      - ./services/traefik/config:/config:rw
      - fs:/fs/terminal
    networks:
      - net_private
      - net_public
    ports:
      - "8443:8443"
    restart: unless-stopped
