# configs\docker-compose.yml
 

networks:

  net_private:
    driver: bridge
    internal: true

  net_public:
    driver: bridge


volumes:

  consul_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../volumes/consul_data

  vault_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../volumes/vault_data

  certs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../volumes/certs


services:

  consul:
    container_name: Consul
    hostname: consul
    env_file:
      - ./debug.env
    build:
      context: ../source/services/consul
    environment:
      SERVICE_NAME: consul
      SERVICE_PORT: 8500
      SERVICE_TAGS: "core,infra,dns,discovery"
    networks:
      - net_private
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.consul-ui.rule=Host(`consul.localhost`)"
      - "traefik.http.routers.consul-ui.entrypoints=websecure"
      - "traefik.http.routers.consul-ui.tls=true"
      - "traefik.http.services.consul-ui.loadbalancer.server.port=8500"
    volumes:
      - consul_data:/consul/data
      - certs:/certs:ro
      - ../source/services/consul/config:/consul/config:rw
      - ../source/services/consul/secrets:/consul/secrets
      - ../source/core:/core:ro
      - ../source/services/consul/app:/app:ro
      - ../configs/debug.env:/opt/env/.env:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "/app/healthcheck.py"]
      interval: 55s
      timeout: 15s
      retries: 3
      start_period: 55s

  vault:
    container_name: Vault
    hostname: vault
    env_file:
      - ./debug.env
    build:
      context: ../source/services/vault
    cap_add:
      - IPC_LOCK 
    environment:
      SERVICE_NAME:  vault
      SERVICE_PORT:  8200
      SERVICE_TAGS:  "core,infra,secret"
      CONSUL_HTTP_TOKEN_FILE: "/consul/secrets/vault_consul_token"
    networks:
      - net_private
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vault-ui.rule=Host(`vault.localhost`)"
      - "traefik.http.routers.vault-ui.entrypoints=websecure"
      - "traefik.http.routers.vault-ui.tls=true"
      - "traefik.http.services.vault-ui.loadbalancer.server.port=8200"
    volumes:
      - vault_data:/vault/file
      - certs:/certs
      - ../source/services/vault/config:/vault/config
      - ../source/services/vault/secrets:/vault/secrets
      - ../source/services/consul/secrets:/consul/secrets:ro
      - ../source/core:/core:ro
      - ../source/services/vault/app:/app:ro
      - ../configs/debug.env:/opt/env/.env:ro
    depends_on:
      consul:
        condition: service_healthy
    restart:
      unless-stopped
    healthcheck:
      test: ["CMD", "python3", "/app/healthcheck.py"]
      interval: 55s
      timeout: 15s
      retries: 3
      start_period: 55s

  traefik:
    container_name: Traefik
    hostname: traefik
    env_file:
      - ./debug.env
    build:
      context: ../source/services/traefik
    environment:
      SERVICE_NAME: traefik
      SERVICE_PORT: 443
      SERVICE_TAGS:  "core,infra,proxy"
      CONSUL_HTTP_TOKEN_FILE: "/consul/secrets/traefik_consul_token"
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    networks:
      - net_public
      - net_private
    ports:
      - "80:80"
      - "443:443"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.tls=true"
    volumes:
      - certs:/certs:ro
      - ../source/services/traefik/config:/etc/traefik:ro
      - ../source/services/consul/secrets:/consul/secrets:ro
      - ../source/core:/core:ro
      - ../source/services/traefik/app:/app:ro
      - ../configs/debug.env:/opt/env/.env:ro
    depends_on:
      consul:
        condition: service_healthy
      vault:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "/app/healthcheck.py"]
      interval: 55s
      timeout: 15s
      retries: 3
      start_period: 55s

