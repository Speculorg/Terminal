version: "3.9"

services:
  # Инфраструктурные сервисы
  infrastructure-service:
    build:
      context: ../docker/infrastructure-service
    ports:
      - "9000:9000"
    volumes:
      - ../configs/:/app/configs/
      - ../modules/infrastructure-service/config/:/app/config/
    env_file:
      - .env.develop
    networks:
      - speculorg_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - infrastructure-consul-module
      - infrastructure-vault-module
      - infrastructure-database-module
      - infrastructure-redis-module
      - infrastructure-rabbitmq-module
      - infrastructure-keycloak-module
      - infrastructure-traefik-module
      - infrastructure-opentelemetry-module
      - infrastructure-prometheus-module
      - infrastructure-grafana-module
      - infrastructure-sentry-module
      - infrastructure-elk-module

  # Модули инфраструктуры
  infrastructure-consul-module:
    build:
      context: ../docker/infrastructure-consul-module
    ports:
      - "9001:9000"
    volumes:
      - ../configs/:/app/configs/
      - ../modules/infrastructure-consul-module/config/:/app/config/
    env_file:
      - .env.develop
    networks:
      - speculorg_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  infrastructure-vault-module:
    build:
      context: ../docker/infrastructure-vault-module
    ports:
      - "9002:9000"
    volumes:
      - ../configs/:/app/configs/
      - ../modules/infrastructure-vault-module/config/:/app/config/
    env_file:
      - .env.develop
    networks:
      - speculorg_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  infrastructure-database-module:
    build:
      context: ../docker/infrastructure-database-module
