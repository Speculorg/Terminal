      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - infrastructure-service
      - security-audit-module
      - security-authentication-module
      - security-authorization-module

  # Модули безопасности
  security-audit-module:
    build:
      context: ../docker/security-audit-module
