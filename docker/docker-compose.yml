      timeout: 10s
      retries: 3
    depends_on:
      - infrastructure-elk-module

  management-configurations-module:
    build:
      context: ../docker/management-configurations-module
    ports:
      - "9015:9000"
    volumes:
      - ../configs/:/app/configs/
      - ../modules/management-configurations-module/config/:/app/config/
    env_file:
      - .env.develop
    networks:
