      - "9003:9000"
    volumes:
      - ../configs/:/app/configs/
      - ../modules/infrastructure-database-module/config/:/app/config/
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env.develop
    networks:
      - speculorg_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  infrastructure-redis-module:
