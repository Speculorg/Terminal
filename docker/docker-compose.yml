      - "9005:9000"
    volumes:
      - ../configs/:/app/configs/
      - ../modules/infrastructure-rabbitmq-module/config/:/app/config/
      - rabbitmq_data:/var/lib/rabbitmq
    env_file:
      - .env.develop
    networks:
      - speculorg_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  infrastructure-keycloak-module:
    build:
      context: ../docker/infrastructure-keycloak-module
    ports:
      - "9006:9000"
    volumes:
      - ../configs/:/app/configs/
      - ../modules/infrastructure-keycloak-module/config/:/app/config/
    env_file:
      - .env.develop
    networks:
      - speculorg_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  infrastructure-traefik-module:
    build:
      context: ../docker/infrastructure-traefik-module
    ports:
      - "9007:9000"
    volumes:
      - ../configs/:/app/configs/
      - ../modules/infrastructure-traefik-module/config/:/app/config/
    env_file:
      - .env.develop
    networks:
      - speculorg_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  infrastructure-opentelemetry-module:
    build:
      context: ../docker/infrastructure-opentelemetry-module
    ports:
      - "9008:9000"
    volumes:
      - ../configs/:/app/configs/
      - ../modules/infrastructure-opentelemetry-module/config/:/app/config/
    env_file:
      - .env.develop
    networks:
      - speculorg_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  infrastructure-prometheus-module:
    build:
      context: ../docker/infrastructure-prometheus-module
    ports:
      - "9009:9000"
    volumes:
      - ../configs/:/app/configs/
      - ../modules/infrastructure-prometheus-module/config/:/app/config/
    env_file:
      - .env.develop
    networks:
      - speculorg_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  infrastructure-grafana-module:
    build:
      context: ../docker/infrastructure-grafana-module
    ports:
      - "9010:9000"
    volumes:
      - ../configs/:/app/configs/
      - ../modules/infrastructure-grafana-module/config/:/app/config/
    env_file:
      - .env.develop
    networks:
      - speculorg_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  infrastructure-sentry-module:
    build:
      context: ../docker/infrastructure-sentry-module
    ports:
      - "9011:9000"
    volumes:
      - ../configs/:/app/configs/
      - ../modules/infrastructure-sentry-module/config/:/app/config/
    env_file:
      - .env.develop
    networks:
      - speculorg_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  infrastructure-elk-module:
    build:
      context: ../docker/infrastructure-elk-module
    ports:
      - "9012:9000"
    volumes:
      - ../configs/:/app/configs/
      - ../modules/infrastructure-elk-module/config/:/app/config/
      - elk_data:/var/lib/elasticsearch
    env_file:
      - .env.develop
    networks:
      - speculorg_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Сервис управления
  management-service:
    build:
      context: ../docker/management-service
    ports:
