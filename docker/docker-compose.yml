      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - infrastructure-consul-module

  management-users-module:
    build:
      context: ../docker/management-users-module
    ports:
      - "9016:9000"
    volumes:
      - ../configs/:/app/configs/
      - ../modules/management-users-module/config/:/app/config/
    env_file:
      - .env.develop
    networks:
      - speculorg_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - infrastructure-database-module

  # Сервис безопасности
  security-service:
    build:
      context: ../docker/security-service
    ports:
      - "9017:9000"
    volumes:
      - ../configs/:/app/configs/
      - ../modules/security-service/config/:/app/config/
    env_file:
      - .env.develop
    networks:
