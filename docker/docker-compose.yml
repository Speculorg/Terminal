  security-authorization-module:
    build:
      context: ../docker/security-authorization-module
    ports:
      - "9020:9000"
    volumes:
      - ../configs/:/app/configs/
      - ../modules/security-authorization-module/config/:/app/config/
    env_file:
      - .env.develop
    networks:
      - speculorg_network
    healthcheck:
