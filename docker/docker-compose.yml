# Speculorg.Terminal Docker Compose Configuration
# This file defines the container orchestration for the Speculorg microservices architecture
# Last updated: 2025.04.13

services:
  #############################################
  # INFRASTRUCTURE SECTION
  #############################################

  # Infrastructure primary service
  infrastructure-service:
    container_name: infrastructure-service
    hostname: infrastructure-service.speculorg.local
    build:
      context: .
      dockerfile: ./infrastructure-service/Dockerfile
    ports:
      - "9000:9000"
    volumes:
      - ../configs/:/app/configs/
      - ../services/infrastructure-service/:/app/
    env_file:
      - ../configs/.env.develop
    environment:
      - PYTHONUNBUFFERED=1
      - SERVICE_NAME=infrastructure-service
      - SERVICE_HOST=0.0.0.0
      - SERVICE_PORT=9000
    networks:
      speculorg_network:
        ipv4_address: 172.20.1.1
        aliases:
          - infrastructure-service
          - infrastructure-service.speculorg.local
      external_network:
        ipv4_address: 172.21.1.1
        aliases:
          - infrastructure-service
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - infrastructure-consul-module
      - infrastructure-vault-module
      - infrastructure-database-module
      - infrastructure-redis-module
      - infrastructure-rabbitmq-module
      - infrastructure-keycloak-module
      - infrastructure-traefik-module
      - infrastructure-opentelemetry-module
      - infrastructure-prometheus-module
      - infrastructure-grafana-module
      - infrastructure-sentry-module
