      test: ["CMD", "curl", "-f", "http://localhost:9303/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - infrastructure-keycloak-module

#############################################
# NETWORKS AND VOLUMES
#############################################

networks:
  # Internal network for microservices communication
  speculorg_network:
    name: speculorg-network
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1

  # External network for exposed services
  external_network:
    name: speculorg-external
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.21.0.0/16
          gateway: 172.21.0.1

volumes:
  # Persistent storage for PostgreSQL database
  postgres_data:
    name: speculorg-postgres-data

  # Persistent storage for Redis cache
  redis_data:
    name: speculorg-redis-data

  # Persistent storage for RabbitMQ message broker
  rabbitmq_data:
    name: speculorg-rabbitmq-data

  # Persistent storage for ELK stack
  elk_data:
    name: speculorg-elk-data
